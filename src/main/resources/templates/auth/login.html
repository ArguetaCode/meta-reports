<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>Iniciar sesión</title></head><body class="bg-light"><main class="container py-5" style="max-width:460px"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3">SODI Meta Reports</h1><div class="alert alert-danger" th:if="${param.error}">Credenciales inválidas, cuenta deshabilitada o bloqueada.</div><div class="alert alert-success" th:if="${param.logout}">Sesión cerrada.</div><form method="post" th:action="@{/login}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="form-label mt-3">Usuario</label><input class="form-control" name="username" required autofocus><label class="form-label mt-3">Contraseña</label><input class="form-control" type="password" name="password" required><button class="btn btn-primary w-100 mt-4">Ingresar</button></form></div></div></main></body></html>
