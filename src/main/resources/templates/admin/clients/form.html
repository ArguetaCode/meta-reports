<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>Cliente</title></head><body><main class="container py-4" style="max-width:800px"><h1>Nuevo cliente</h1><form method="post" th:action="@{/admin/clients}" th:object="${clientForm}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><div th:each="e:${#fields.allErrors()}" th:text="${e}"></div></div><div class="row g-3"><div class="col-md-4"><label>Código</label><input class="form-control text-uppercase" th:field="*{code}" required></div><div class="col-md-8"><label>Nombre comercial</label><input class="form-control" th:field="*{commercialName}" required></div><div class="col-12"><label>Nombre legal</label><input class="form-control" th:field="*{legalName}"></div><div class="col-12"><label>Descripción</label><textarea class="form-control" th:field="*{description}"></textarea></div><div class="col-md-4"><label>Estado</label><select class="form-select" th:field="*{status}"><option th:each="s:${T(com.sodi.metareports.client.entity.ClientStatus).values()}" th:value="${s}" th:text="${s}"></option></select></div><div class="col-md-4"><label>Moneda ISO</label><input class="form-control text-uppercase" th:field="*{primaryCurrency}" maxlength="3"></div><div class="col-md-4"><label>Zona horaria</label><input class="form-control" th:field="*{timezone}"></div></div><button class="btn btn-primary mt-3">Guardar</button></form></main></body></html>
