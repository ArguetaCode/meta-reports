<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>Cliente</title></head>
<body><main class="container py-4"><a href="/admin/clients">← Clientes</a><h1 th:text="${client.commercialName}"></h1>
<p><span class="badge bg-secondary" th:text="${client.code}"></span> <span th:text="${client.status}"></span></p>
<div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<form method="post" th:action="@{'/admin/clients/'+${client.id}+'/toggle'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-outline-warning" onclick="return confirm('¿Cambiar el estado activo del cliente?')">Activar/desactivar</button></form>
<hr><h2>Activos asociados</h2><div class="table-responsive"><table class="table"><tr><th>Tipo</th><th>ID Meta</th><th>Nombre</th></tr><tr th:each="a:${assets}"><td th:text="${a.type}"></td><td th:text="${a.meta_id}"></td><td th:text="${a.name}"></td></tr></table></div>
<div class="row g-3"><div class="col-lg-4" th:each="kind:${ {'facebook','instagram','ad-account'} }"><div class="card card-body" th:switch="${kind}">
<form th:case="'facebook'" method="post" th:action="@{'/admin/clients/'+${client.id}+'/facebook'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><h3 class="h5">Página Facebook</h3><input class="form-control mb-2" name="metaId" pattern="[0-9]{3,80}" placeholder="Page ID" required><input class="form-control mb-2" name="name" placeholder="Nombre" required><button class="btn btn-primary">Agregar</button></form>
<form th:case="'instagram'" method="post" th:action="@{'/admin/clients/'+${client.id}+'/instagram'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><h3 class="h5">Instagram</h3><input class="form-control mb-2" name="metaId" pattern="[0-9]{3,80}" placeholder="Instagram ID" required><input class="form-control mb-2" name="username" placeholder="Usuario" required><button class="btn btn-primary">Agregar</button></form>
<form th:case="*" method="post" th:action="@{'/admin/clients/'+${client.id}+'/ad-account'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><h3 class="h5">Cuenta publicitaria</h3><input class="form-control mb-2" name="metaId" pattern="(?:act_)?[0-9]{3,80}" placeholder="ID de cuenta" required><input class="form-control mb-2" name="name" placeholder="Nombre" required><input class="form-control mb-2" name="currency" pattern="[A-Za-z]{3}" value="USD" required><label><input type="checkbox" name="exclusive"> Exclusiva</label><button class="btn btn-primary mt-2">Agregar</button></form>
</div></div></div>
<hr><h2>Prefijos</h2><ul><li th:each="p:${prefixes}" th:text="${p.prefix+' - '+(p.description?:'')}"></li></ul><form class="row g-2" method="post" th:action="@{'/admin/clients/'+${client.id}+'/prefix'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="col-md-3"><input class="form-control text-uppercase" name="prefix" pattern="[A-Za-z0-9][A-Za-z0-9_-]{1,29}" required></div><div class="col-md-6"><input class="form-control" name="description" placeholder="Descripción"></div><div class="col-md-3"><button class="btn btn-primary">Agregar prefijo</button></div></form>
<hr><h2>Branding</h2><form class="card card-body" method="post" enctype="multipart/form-data" th:action="@{'/admin/clients/'+${client.id}+'/branding'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="row g-3"><div class="col-md-4" th:each="color:${ {'primary','secondary','accent'} }"><label class="form-label" th:text="${'Color '+color}"></label><input class="form-control" th:name="${color+'Color'}" pattern="#[0-9A-Fa-f]{6}" placeholder="#0057B8"></div><div class="col-md-6"><label class="form-label">Encabezado de informe</label><input class="form-control" name="header" maxlength="500"></div><div class="col-md-6"><label class="form-label">Pie de informe</label><input class="form-control" name="footer" maxlength="500"></div><div class="col-md-8"><label class="form-label">Logo PNG, JPG o WEBP (máx. 5 MB)</label><input class="form-control" type="file" name="logo" accept=".png,.jpg,.jpeg,.webp"></div><div class="col-md-4 d-flex align-items-end"><button class="btn btn-primary">Guardar branding</button></div></div></form>
</main></body></html>
