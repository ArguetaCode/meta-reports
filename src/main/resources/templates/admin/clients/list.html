<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>Clientes</title></head><body><main class="container py-4"><a href="/admin">← Dashboard</a><div class="d-flex justify-content-between"><h1>Clientes</h1><a class="btn btn-primary" href="/admin/clients/new">Nuevo</a></div><div class="table-responsive"><table class="table"><thead><tr><th>Código</th><th>Nombre</th><th>Estado</th><th>Moneda</th></tr></thead><tbody><tr th:each="c:${clients.content}"><td><a th:href="@{'/admin/clients/'+${c.id}}" th:text="${c.code}"></a></td><td th:text="${c.commercialName}"></td><td th:text="${c.status}"></td><td th:text="${c.primaryCurrency}"></td></tr></tbody></table></div><nav><a class="btn btn-outline-secondary" th:if="${clients.hasPrevious()}" th:href="@{/admin/clients(page=${clients.number-1})}">Anterior</a><a class="btn btn-outline-secondary" th:if="${clients.hasNext()}" th:href="@{/admin/clients(page=${clients.number+1})}">Siguiente</a></nav></main></body></html>
