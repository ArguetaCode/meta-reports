<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>Métricas y períodos</title></head><body><main class="container py-4"><a href="/admin">← Administración</a><h1 class="h3 mt-2">Métricas y períodos mensuales</h1><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="row g-4"><section class="col-lg-4"><h2 class="h5">Fixture anonimizado</h2><form th:action="@{/admin/metrics/import}" method="post" sec:authorize="hasAuthority('SYNC_EXECUTE')"><button class="btn btn-primary">Importar métricas</button></form></section><section class="col-lg-8"><h2 class="h5">Tipo de cambio mensual</h2><form th:action="@{/admin/metrics/rates}" method="post" class="row g-2" sec:authorize="hasAuthority('REPORT_GENERATE')"><div class="col"><input type="date" name="month" class="form-control" required></div><div class="col"><input name="source" value="USD" maxlength="3" class="form-control" required></div><div class="col"><input name="target" value="GTQ" maxlength="3" class="form-control" required></div><div class="col"><input type="number" name="rate" step="0.00000001" min="0.00000001" class="form-control" placeholder="Tasa" required></div><div class="col"><input name="rateSource" class="form-control" value="Referencia manual" required></div><div class="col-auto"><button class="btn btn-outline-primary">Guardar</button></div></form></section></div><hr><h2 class="h5">Crear período de revisión</h2><form th:action="@{/admin/metrics/periods}" method="post" class="row g-2 mb-4" sec:authorize="hasAuthority('REPORT_GENERATE')"><div class="col-md-4"><select name="clientId" class="form-select" required><option value="">Cliente…</option><option th:each="c:${clients}" th:value="${c.id}" th:text="${c.code + ' — ' + c.commercial_name}"></option></select></div><div class="col"><input type="date" name="start" class="form-control" required></div><div class="col"><input type="date" name="end" class="form-control" required></div><div class="col-auto"><button class="btn btn-primary">Crear período</button></div></form><h2 class="h5">Períodos</h2><div class="table-responsive"><table class="table table-striped"><thead><tr><th>Cliente</th><th>Inicio</th><th>Fin</th><th>Moneda</th><th>Tasa congelada</th><th></th></tr></thead><tbody><tr th:each="p:${periods}"><td th:text="${p.code + ' — ' + p.commercial_name}"></td><td th:text="${p.period_start}"></td><td th:text="${p.period_end}"></td><td th:text="${p.report_currency}"></td><td th:text="${p.exchange_rate_snapshot}"></td><td><a th:href="@{/admin/reports/{id}/review(id=${p.id})}" class="btn btn-sm btn-outline-primary">Revisar</a></td></tr></tbody></table></div><h2 class="h5 mt-4">Tasas registradas</h2><table class="table table-sm"><thead><tr><th>Mes</th><th>Conversión</th><th>Tasa</th><th>Fuente</th></tr></thead><tbody><tr th:each="r:${rates}"><td th:text="${r.rate_month}"></td><td th:text="${r.source_currency + ' → ' + r.target_currency}"></td><td th:text="${r.rate}"></td><td th:text="${r.rate_source}"></td></tr></tbody></table></main></body></html>
