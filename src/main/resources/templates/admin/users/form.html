<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>Usuario</title></head><body><main class="container py-4" style="max-width:760px"><h1>Nuevo usuario</h1><form method="post" th:action="@{/admin/users}" th:object="${userForm}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><div th:each="e:${#fields.allErrors()}" th:text="${e}"></div></div><div class="row g-3"><div class="col-md-6"><label>Usuario</label><input class="form-control" th:field="*{username}" required></div><div class="col-md-6"><label>Email</label><input class="form-control" type="email" th:field="*{email}" required></div><div class="col-md-6"><label>Nombres</label><input class="form-control" th:field="*{firstName}" required></div><div class="col-md-6"><label>Apellidos</label><input class="form-control" th:field="*{lastName}" required></div><div class="col-12"><label>Contraseña inicial</label><input class="form-control" type="password" th:field="*{password}" minlength="12" required></div><div class="col-12"><label>Roles</label><div th:each="r:${roles}"><input type="checkbox" th:field="*{roleCodes}" th:value="${r.code}"><span th:text="${r.name}"></span></div></div></div><button class="btn btn-primary mt-3">Guardar</button></form></main></body></html>
