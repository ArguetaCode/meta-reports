<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>Usuarios</title></head><body><main class="container py-4"><a href="/admin">← Dashboard</a><div class="d-flex justify-content-between"><h1>Usuarios</h1><a class="btn btn-primary" href="/admin/users/new">Nuevo</a></div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="table-responsive"><table class="table"><thead><tr><th>Usuario</th><th>Email</th><th>Estado</th><th>Roles</th><th>Acciones</th></tr></thead><tbody><tr th:each="u:${users}"><td th:text="${u.username}"></td><td th:text="${u.email}"></td><td th:text="${u.enabled?'Activo':'Inactivo'}"></td><td><span th:each="r:${u.roles}" class="badge bg-secondary me-1" th:text="${r.code}"></span></td><td><form class="d-inline" method="post" th:action="@{'/admin/users/'+${u.id}+'/toggle'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-warning">Activar/desactivar</button></form><form class="d-inline" method="post" th:action="@{'/admin/users/'+${u.id}+'/unlock'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-secondary">Desbloquear</button></form><form class="mt-1" method="post" th:action="@{'/admin/users/'+${u.id}+'/password'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="password" type="password" minlength="12" required placeholder="Nueva contraseña"><button class="btn btn-sm btn-outline-danger">Cambiar</button></form></td></tr></tbody></table></div></main></body></html>
