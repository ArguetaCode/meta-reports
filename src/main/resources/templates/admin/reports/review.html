<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>Revisión del período</title></head><body><main class="container py-4"><a href="/admin/metrics">← Métricas</a><h1 class="h3 mt-2" th:text="${'Revisión — ' + period.commercial_name}"></h1><p><span th:text="${period.period_start}"></span> a <span th:text="${period.period_end}"></span> · <strong th:text="${period.report_currency}"></strong> · tasa congelada <span th:text="${period.exchange_rate_snapshot}"></span></p><div class="alert alert-info">Los valores son pagados y proceden del fixture Meta. Alcance diario se suma únicamente para revisión operativa; no representa alcance único del período.</div><div class="table-responsive"><table class="table table-striped"><thead><tr><th>Campaña</th><th>Anuncio</th><th>Gasto origen</th><th>Gasto informe</th><th>Impresiones</th><th>Alcance diario acumulado</th><th>Clics</th><th>CTR %</th></tr></thead><tbody><tr th:each="r:${rows}"><td th:text="${r.campaign_name}"></td><td><span th:text="${r.ad_name}"></span><br><small th:text="${r.meta_ad_id}"></small></td><td th:text="${r.spend_source}"></td><td th:text="${r.spend_report}"></td><td th:text="${r.impressions}"></td><td th:text="${r.reach}"></td><td th:text="${r.clicks}"></td><td th:text="${r.ctr}"></td></tr></tbody></table></div></main></body></html>
