<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>Incidencias</title></head><body><main class="container-fluid py-4 px-lg-5"><a href="/admin/synchronizations">← Sincronizaciones</a><h1 class="h3 mt-2">Incidencias de clasificación</h1><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="table-responsive"><table class="table table-striped align-middle"><thead><tr><th>Fecha</th><th>Tipo / estado</th><th>Anuncio</th><th>Campaña</th><th>Descripción / resolución</th><th sec:authorize="hasAuthority('INCIDENT_RESOLVE')">Acciones</th></tr></thead><tbody><tr th:each="i:${incidents}"><td th:text="${i.occurred_at}"></td><td><strong th:text="${i.incident_type}"></strong><br><span class="badge" th:classappend="${i.status == 'OPEN'} ? ' text-bg-warning' : ' text-bg-secondary'" th:text="${i.status}"></span></td><td><span th:text="${i.ad_name}"></span><br><small th:text="${i.meta_ad_id}"></small></td><td th:text="${i.campaign_name}"></td><td><span th:text="${i.description}"></span><div th:if="${i.resolution_note}" class="small mt-1"><strong th:text="${i.resolved_client ?: 'Sin cliente'}"></strong>: <span th:text="${i.resolution_note}"></span></div></td><td sec:authorize="hasAuthority('INCIDENT_RESOLVE')"><div th:if="${i.status == 'OPEN'}" style="min-width:22rem"><form th:action="@{/admin/incidents/{id}/resolve(id=${i.id})}" method="post" class="mb-2"><div class="input-group input-group-sm"><select name="clientId" class="form-select" required><option value="">Asignar cliente…</option><option th:each="c:${clients}" th:value="${c.id}" th:text="${c.code + ' — ' + c.commercial_name}"></option></select><input name="note" class="form-control" minlength="5" maxlength="1000" placeholder="Motivo" required><button class="btn btn-primary">Resolver</button></div></form><div class="d-flex gap-2"><form th:action="@{/admin/incidents/{id}/reprocess(id=${i.id})}" method="post" class="d-flex gap-1"><input name="note" class="form-control form-control-sm" minlength="5" maxlength="1000" value="Revisión de señales actuales" required><button class="btn btn-sm btn-outline-primary">Reprocesar</button></form><form th:action="@{/admin/incidents/{id}/ignore(id=${i.id})}" method="post" class="d-flex gap-1"><input name="note" class="form-control form-control-sm" minlength="5" maxlength="1000" placeholder="Motivo para ignorar" required><button class="btn btn-sm btn-outline-secondary">Ignorar</button></form></div></div></td></tr></tbody></table></div></main></body></html>
