<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>Sincronizaciones</title></head><body><main class="container py-4"><a href="/admin">← Dashboard</a><h1>Sincronizaciones simuladas</h1><p class="text-muted">Solo procesa fixtures locales; no realiza llamadas a Meta.</p><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form class="card card-body mb-4" method="post" th:action="@{/admin/synchronizations}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="form-label">Fixture</label><select class="form-select" name="fixture"><option value="phase3-demo">phase3-demo</option></select><button class="btn btn-primary mt-3">Ejecutar sincronización</button></form><div class="table-responsive"><table class="table table-striped"><thead><tr><th>Inicio</th><th>Fixture</th><th>Estado</th><th>Páginas</th><th>Recibidos</th><th>Upserts</th><th>Incidencias</th></tr></thead><tbody><tr th:each="e:${executions}"><td th:text="${e.started_at}"></td><td th:text="${e.fixture_name}"></td><td th:text="${e.status}"></td><td th:text="${e.pages_processed}"></td><td th:text="${e.records_received}"></td><td th:text="${e.records_upserted}"></td><td th:text="${e.incidents_created}"></td></tr></tbody></table></div><a class="btn btn-outline-secondary" href="/admin/incidents">Ver incidencias</a></main></body></html>
